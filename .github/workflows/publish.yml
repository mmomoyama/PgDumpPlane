name: Publish NuGet package

# GitHubリリースの公開を起点にテスト・パッケージ生成・NuGet公開を行います。
# Test, pack, and publish to NuGet when a GitHub release is published.
on:
  release:
    types: [published]

permissions:
  # Trusted PublishingのOIDC認証に必要なトークン発行を許可します。
  # Permit token issuance required for Trusted Publishing OIDC authentication.
  contents: read
  id-token: write

concurrency:
  # 同じリリースタグの公開を直列化し、実行途中の公開をキャンセルしません。
  # Serialize publication for each release tag without cancelling a running publish.
  group: nuget-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release

    services:
      # パッケージ生成前にPostgreSQL 18で往復・失敗時ロールバックを検証します。
      # Check round trips and rollback on PostgreSQL 18 before creating the package.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGDUMPPLANE_TEST_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PgDumpPlane.slnx

      - name: Test
        run: dotnet test PgDumpPlane.slnx -c Release --no-restore

      - name: Pack release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # タグ先頭のvだけを取り除き、公開版をプロジェクトのVersionより優先します。
          # Strip only the leading v and override the project Version with the release version.
          package_version="${RELEASE_TAG#v}"
          dotnet pack src/PgDumpPlane/PgDumpPlane.csproj \
            -c Release \
            --no-restore \
            -p:Version="$package_version" \
            -o artifacts

      - name: Save package artifact
        # 公開したパッケージとシンボルを後から取得できるよう保存します。
        # Retain packages and symbols as downloadable workflow artifacts.
        uses: actions/upload-artifact@v6
        with:
          name: PgDumpPlane-${{ github.event.release.tag_name }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: NuGet login with trusted publishing
        # 長期APIキーではなく、OIDC認証で公開用の短期キーを取得します。
        # Obtain a short-lived publishing key through OIDC rather than a long-lived API key.
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        # 同じ版が既に公開済みでも再実行を失敗にしません。
        # Allow reruns when the same package version is already published.
        shell: bash
        run: >-
          dotnet nuget push artifacts/*.nupkg
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
